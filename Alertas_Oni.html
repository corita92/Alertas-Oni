<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Alertas Oni</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{--ink:#06201c;--accent:#19f2e0}
html,body{margin:0;height:100%;overflow:hidden;background:transparent}
body.panel{background:repeating-conic-gradient(#1b1f24 0 25%,#14171b 0 50%) 0 0/40px 40px}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#alert{position:relative;display:flex;flex-direction:column;align-items:center;visibility:hidden}
.aura{position:absolute;top:-10vmin;left:50%;width:80vmin;height:80vmin;margin-left:-40vmin;border-radius:50%;
  background:radial-gradient(closest-side,var(--accent),transparent);filter:blur(2vmin);opacity:0}
.mask{position:relative;z-index:3;height:31vmin;aspect-ratio:431/520}
.mask img{width:100%;height:100%;display:block}
.raid-alert .mask{filter:drop-shadow(0 0 2vmin var(--accent)) drop-shadow(0 0 5vmin var(--accent))}
.raid-alert .ring{border-width:1.2vmin;box-shadow:0 0 2vmin var(--accent),inset 0 0 2vmin var(--accent)}
.raid-alert .kind{animation:raidTextPulse .75s ease-in-out infinite alternate}
.raid-alert .aura{opacity:.35}
@keyframes raidTextPulse{from{filter:brightness(1);text-shadow:0 0 1.4vmin var(--accent),0 .4vmin 0 #06201c}to{filter:brightness(1.8);text-shadow:0 0 2.8vmin var(--accent),0 0 5vmin var(--accent),0 .4vmin 0 #06201c}}
.eye,.dim{position:absolute;top:41.6%;width:20%;height:9.4%;border-radius:50%;animation:glow 2.8s ease-in-out infinite}
.eye{mix-blend-mode:screen;background:radial-gradient(closest-side,#fff 0%,var(--accent) 38%,color-mix(in srgb,var(--accent),transparent 100%) 74%)}
.dim{opacity:0;mix-blend-mode:multiply;background:radial-gradient(closest-side,#2c6e62 0%,#2c6e62 45%,rgba(44,110,98,0) 100%);animation-name:dimout}
.l{left:20.7%;--rot:14deg}.r{left:60%;--rot:-14deg}
@keyframes glow{0%,100%{opacity:1;transform:rotate(var(--rot)) scale(1.08)}50%{opacity:.5;transform:rotate(var(--rot)) scale(.85)}}
@keyframes dimout{0%,100%{opacity:0;transform:rotate(var(--rot))}50%{opacity:.3;transform:rotate(var(--rot))}}
.ring{position:absolute;left:0;top:0;width:100%;aspect-ratio:1;border:.8vmin solid var(--accent);border-radius:50%;opacity:0}
.spark{position:absolute;left:50%;top:50%;width:1.2vmin;height:1.2vmin;box-shadow:0 0 1vmin var(--accent);pointer-events:none}
.plate{position:relative;z-index:1;margin-top:2.5vmin;max-width:98vw;padding:0 4vmin;text-align:center}
.txt{position:relative;z-index:2;filter:drop-shadow(0 0 2.2vmin rgba(6,32,28,.9))}
.kind{font:600 4vmin/1.1 'Barlow Condensed','Arial Narrow',sans-serif;color:var(--accent);letter-spacing:.04em;
  text-shadow:0 0 1.4vmin var(--accent),0 .4vmin 0 #06201c,.3vmin 0 0 #06201c,-.3vmin 0 0 #06201c}
.name{--o:#06201c;font:400 8.2vmin/1.05 'Lilita One',Impact,sans-serif;color:#ffe08a;white-space:nowrap;
  text-shadow:.55vmin 0 0 var(--o),-.55vmin 0 0 var(--o),0 .55vmin 0 var(--o),0 -.55vmin 0 var(--o),.4vmin .4vmin 0 var(--o),-.4vmin .4vmin 0 var(--o),.4vmin -.4vmin 0 var(--o),-.4vmin -.4vmin 0 var(--o),0 1vmin 0 var(--o)}
.detail{font:600 4vmin/1.15 'Barlow Condensed','Arial Narrow',sans-serif;color:#e6fff6;margin-top:.8vmin;
  text-shadow:.3vmin 0 0 #06201c,-.3vmin 0 0 #06201c,0 .3vmin 0 #06201c,0 -.3vmin 0 #06201c,0 .6vmin 0 #06201c}
#panel{position:fixed;left:12px;bottom:12px;font:14px system-ui;color:#cfe;display:flex;gap:6px;flex-wrap:wrap;align-items:center;z-index:9}
#panel button{background:#0d1b19;color:#5fd1b0;border:1px solid #c9973f;border-radius:6px;padding:7px 12px;cursor:pointer}
</style>
</head>

<script>
// ===== Tipos de alerta: acá cambiás textos, colores y duración (segundos) =====
const TYPES = {
  follow:  {color:'#19f2e0', kind:()=>'Nuevo seguidor',     detail:e=>'Ya sos parte del clan', hold:6},
  sub:     {color:'#e0b04a', kind:()=>'Nueva suscripción',  detail:e=>(e.tier==='prime'?'Prime':'Tier '+(e.tier||1))+': el clan te recibe', hold:7},
  resub:   {color:'#5fd1b0', kind:()=>'Resub',              detail:e=>e.months+(e.months==1?' mes':' meses')+' en el clan', hold:7},
  giftsub: {color:'#e08a3c', kind:()=>'Sub regalada',       detail:e=>e.count>1?'Regaló '+e.count+' subs a la comunidad':'Le regaló una sub a '+(e.to||'un viewer'), hold:7},
  bits:    {color:'#7aa8ff', kind:()=>'Bits',                detail:e=>e.amount+' bits para la causa', hold:6.5},
  raid:    {color:'#ff5a3c', kind:()=>'¡Raid entrante!',     detail:e=>'Llegan '+e.amount+' viewers a la guarida', hold:9}
};

const $=s=>document.querySelector(s), A=$('#alert'), mask=$('.mask'), ring=$('.ring'), aura=$('.aura'),
      plate=$('.plate'), nameEl=$('.name'), kindEl=$('.kind'), detEl=$('.detail');
const vmin=()=>Math.min(innerWidth,innerHeight)/100, sleep=ms=>new Promise(r=>setTimeout(r,ms));
const queue=[]; let busy=false;

function push(ev){ if(!TYPES[ev.type])return; queue.push(ev); if(!busy)drain(); }
async function drain(){ busy=true; while(queue.length){ await play(queue.shift()); await sleep(500);} busy=false; }

function sparks(n){
  const cols=[getComputedStyle(document.documentElement).getPropertyValue('--accent'),'#c9973f'];
  for(let i=0;i<n;i++){
    const d=document.createElement('i'); d.className='spark'; d.style.background=cols[i%2]; mask.appendChild(d);
    const a=Math.random()*6.283, r=(14+Math.random()*22)*vmin();
    d.animate([{transform:'translate(-50%,-50%) rotate(45deg) scale(1)',opacity:1},
      {transform:`translate(calc(-50% + ${Math.cos(a)*r}px),calc(-50% + ${Math.sin(a)*r}px)) rotate(45deg) scale(.2)`,opacity:0}],
      {duration:700+Math.random()*600,easing:'cubic-bezier(.1,.7,.3,1)'}).onfinish=()=>d.remove();
  }
}

async function play(ev){
  const t=TYPES[ev.type], v=vmin(), isRaid=ev.type==='raid';
  document.documentElement.style.setProperty('--accent',t.color);
  A.classList.toggle('raid-alert',isRaid);
  kindEl.textContent=t.kind(ev); detEl.textContent=t.detail(ev); nameEl.textContent=ev.name||'Anónimo';
  let fs=8.2; nameEl.style.fontSize=fs+'vmin';
  const limit=Math.min(innerWidth*.96,124*v)-10*v;
  while(nameEl.scrollWidth>limit && fs>2.8){ fs-=.4; nameEl.style.fontSize=fs+'vmin'; }

  A.style.visibility='visible';
  mask.animate(isRaid
    ?[{transform:'scale(3.1) rotate(-16deg)',opacity:0,filter:'brightness(2.2)'},{transform:'scale(.88) rotate(5deg)',opacity:1,offset:.68},{transform:'scale(1) rotate(0)',opacity:1,filter:'brightness(1)'}]
    :[{transform:'scale(2.4) rotate(-6deg)',opacity:0},{transform:'scale(.92) rotate(1deg)',opacity:1,offset:.7},{transform:'scale(1)',opacity:1}],
    {duration:isRaid?850:520,easing:'cubic-bezier(.2,.9,.3,1)',fill:'both'});
  aura.animate([{opacity:0,transform:'scale(.35)'},{opacity:isRaid?.95:.6,offset:.3},{opacity:isRaid?.48:.22,transform:'scale(1.12)'}],
    {duration:isRaid?1750:1300,delay:isRaid?100:300,fill:'both'});
  plate.animate([{transform:isRaid?'translateY(-7vmin) scale(.55)':'translateY(-4vmin) scale(.8)',opacity:0},{transform:'none',opacity:1}],
    {duration:isRaid?650:460,delay:isRaid?520:420,easing:'cubic-bezier(.2,.8,.2,1)',fill:'both'});
  [kindEl,nameEl,detEl].forEach((el,i)=>el.animate([{opacity:0,transform:'translateY(1.4vmin)'},{opacity:1,transform:'none'}],
    {duration:isRaid?480:380,delay:(isRaid?760:640)+i*110,easing:'ease-out',fill:'both'}));

  await sleep(isRaid?480:330);
  const ringFrames=isRaid
    ?[{opacity:1,transform:'scale(.35)'},{opacity:0,transform:'scale(3.1)'}]
    :[{opacity:.9,transform:'scale(.6)'},{opacity:0,transform:'scale(2.6)'}];
  ring.animate(ringFrames,{duration:isRaid?1150:800,easing:'ease-out'});
  if(isRaid) ring.animate([{opacity:.8,transform:'scale(.55)'},{opacity:0,transform:'scale(2.4)'}],
    {duration:950,delay:260,easing:'ease-out'});
  A.animate(isRaid
    ?[{transform:'translate(0,0)'},{transform:'translate(-2vmin,1vmin)'},{transform:'translate(2vmin,-1vmin)'},{transform:'translate(-1vmin,.5vmin)'},{transform:'translate(0,0)'}]
    :[{transform:'translate(0,0)'},{transform:'translate(-1.2vmin,.6vmin)'},{transform:'translate(1vmin,-.8vmin)'},{transform:'translate(-.6vmin,.4vmin)'},{transform:'translate(0,0)'}],
    {duration:isRaid?520:320});
  sparks(isRaid?64:22);

  await sleep(t.hold*1000);
  await A.animate([{opacity:1,transform:'none'},{opacity:0,transform:'translateY(-3vmin) scale(.94)'}],{duration:450,fill:'forwards'}).finished;
  document.getAnimations().filter(a=>!(a instanceof CSSAnimation)).forEach(a=>a.cancel());
  A.classList.remove('raid-alert'); A.style.visibility='hidden';
}

// ===== Panel de pruebas: solo aparece al abrir el archivo en un navegador común (no en OBS) =====
if(location.protocol==='file:' && !window.obsstudio){
  document.body.classList.add('panel'); const p=$('#panel'); p.hidden=false;
  const demo={follow:{name:'LoboNocturno'},sub:{name:'ZorroJade',tier:1},resub:{name:'KatanaRoja',months:6},
    giftsub:{name:'GenerosoGus',count:5},bits:{name:'BitsMaster',amount:500},raid:{name:'ClanDelTrueno',amount:87}};
  Object.keys(demo).forEach(k=>{const b=document.createElement('button'); b.textContent=k; b.onclick=()=>push({type:k,...demo[k]}); p.appendChild(b);});
}

// ===== Eventos reales: StreamElements (widget personalizado) =====
window.addEventListener('onEventReceived',o=>{
  const l=o.detail.listener, e=o.detail.event||{};
  if(l==='follower-latest') push({type:'follow',name:e.name});
  else if(l==='cheer-latest') push({type:'bits',name:e.name,amount:e.amount});
  else if(l==='raid-latest') push({type:'raid',name:e.name,amount:e.amount});
  else if(l==='subscriber-latest'){
    if(e.isCommunityGift) return;
    if(e.bulkGifted) push({type:'giftsub',name:e.sender||e.name,count:e.amount});
    else if(e.gifted) push({type:'giftsub',name:e.sender,to:e.name,count:1});
    else if(e.amount>1) push({type:'resub',name:e.name,months:e.amount});
    else push({type:'sub',name:e.name,tier:e.tier});
  }
});
window.alertaOni=push;   // por si querés dispararlas desde otro script
</script>
